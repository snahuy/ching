services:
  - type: web
    name: ching-multiplayer
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ching-nine.vercel.app
